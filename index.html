<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日清オイリオグループ (2602.T) 株価チャート</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ヘッダー部: 株価情報 */
        .stock-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .company-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .company-info h1 {
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 700;
            color: #1a1a1a;
        }

        .symbol {
            font-size: clamp(14px, 2vw, 24px);
            color: #666;
            background: #f0f0f0;
            padding: 5px 15px;
            border-radius: 8px;
        }

        .price-info {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .current-price {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: clamp(12px, 1.5vw, 18px);
            color: #666;
            margin-bottom: 5px;
        }

        .price {
            font-size: clamp(36px, 6vw, 80px);
            font-weight: 700;
            color: #1a1a1a;
        }

        .price-change {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .change,
        .change-percent {
            font-size: clamp(16px, 2.5vw, 32px);
            font-weight: 600;
        }

        .positive {
            color: #22c55e;
        }

        .negative {
            color: #ef4444;
        }

        .neutral {
            color: #666;
        }

        .additional-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px 0;
            border-top: 2px solid #f0f0f0;
            border-bottom: 2px solid #f0f0f0;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: clamp(12px, 1.5vw, 16px);
            color: #666;
        }

        .info-value {
            font-size: clamp(16px, 2vw, 28px);
            font-weight: 600;
            color: #1a1a1a;
        }

        .update-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: clamp(12px, 1.5vw, 16px);
            color: #666;
            flex-wrap: wrap;
            gap: 10px;
        }

        .market-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .market-open {
            background: #dcfce7;
            color: #16a34a;
        }

        .market-closed {
            background: #fee2e2;
            color: #dc2626;
        }

        /* チャート表示部 */
        .chart-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 60vh;
            min-height: 400px;
        }

        /* フッター */
        footer {
            text-align: center;
            color: white;
            font-size: clamp(12px, 1.5vw, 14px);
            padding: 20px;
        }

        footer p {
            margin: 5px 0;
        }

        /* ローディング表示 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* エラーメッセージ */
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
        }

        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .stock-header,
            .chart-container {
                padding: 20px;
                border-radius: 15px;
            }

            .price-info {
                flex-direction: column;
                gap: 10px;
            }

            .additional-info {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .update-info {
                flex-direction: column;
                align-items: flex-start;
            }

            .chart-wrapper {
                height: 50vh;
                min-height: 300px;
            }
        }

        /* 大画面対応 */
        @media (min-width: 1920px) {
            .chart-wrapper {
                height: 70vh;
                min-height: 600px;
            }
        }
    </style>
</head>
<body>
    <!-- ローディング表示 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="container">
        <!-- エラーメッセージ -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- ヘッダー部: 株価情報 -->
        <header class="stock-header">
            <div class="company-info">
                <h1 id="companyName">日清オイリオグループ</h1>
                <span id="stockSymbol" class="symbol">2602.T</span>
            </div>

            <div class="price-info">
                <div class="current-price">
                    <span class="price-label">現在値</span>
                    <span id="currentPrice" class="price">-</span>
                </div>
                <div class="price-change">
                    <span id="priceChange" class="change">-</span>
                    <span id="changePercent" class="change-percent">-</span>
                </div>
            </div>

            <div class="additional-info">
                <div class="info-item">
                    <span class="info-label">高値</span>
                    <span id="highPrice" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">安値</span>
                    <span id="lowPrice" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">出来高</span>
                    <span id="volume" class="info-value">-</span>
                </div>
            </div>

            <div class="update-info">
                <span id="lastUpdate">最終更新: -</span>
                <span id="marketStatus" class="market-status">-</span>
            </div>
        </header>

        <!-- チャート表示部 -->
        <main class="chart-container">
            <div class="chart-wrapper">
                <canvas id="stockChart"></canvas>
            </div>
        </main>

        <!-- フッター -->
        <footer>
            <p>※株価データは30分間隔で自動更新されます（市場時間9:00-16:00のみ）</p>
            <p>データ提供: Yahoo Finance</p>
        </footer>
    </div>

    <script>
        // グローバル変数
        let chart = null;
        let cachedData = null;
        let lastFetchTime = null;
        const STOCK_SYMBOL = '2602.T';
        const UPDATE_INTERVAL = 30 * 60 * 1000; // 30分（ミリ秒）
        const POLL_INTERVAL = 30 * 1000; // 30秒（ミリ秒）

        /**
         * 現在時刻が市場時間内（9:00-16:00）かチェック
         */
        function isMarketHours() {
            const now = new Date();
            const hours = now.getHours();
            const day = now.getDay();

            // 土日は除外
            if (day === 0 || day === 6) {
                return false;
            }

            // 9:00-16:00の間のみtrue
            return hours >= 9 && hours < 16;
        }

        /**
         * 数値をフォーマット（カンマ区切り）
         */
        function formatNumber(num, decimals = 0) {
            if (num === null || num === undefined || isNaN(num)) return '-';
            return num.toLocaleString('ja-JP', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        /**
         * 出来高を見やすい形式にフォーマット
         */
        function formatVolume(volume) {
            if (volume === null || volume === undefined || isNaN(volume)) return '-';
            if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(2) + 'K';
            }
            return formatNumber(volume);
        }

        /**
         * 日時をフォーマット
         */
        function formatDateTime(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        /**
         * エラーメッセージを表示
         */
        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
            setTimeout(() => {
                errorElement.classList.add('hidden');
            }, 5000);
        }

        /**
         * ローディング表示の切り替え
         */
        function toggleLoading(show) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (show) {
                loadingOverlay.classList.remove('hidden');
            } else {
                loadingOverlay.classList.add('hidden');
            }
        }

        /**
         * Yahoo Finance APIから株価データを取得
         */
        async function fetchStockData() {
            try {
                console.log('株価データを取得中...');

                // 1年前の日付を計算
                const endDate = Math.floor(Date.now() / 1000);
                const startDate = endDate - (365 * 24 * 60 * 60);

                // CORSプロキシを使用してYahoo Finance APIにアクセス
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const apiUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${STOCK_SYMBOL}?period1=${startDate}&period2=${endDate}&interval=1d`;
                const url = proxyUrl + encodeURIComponent(apiUrl);

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('データの取得に失敗しました');
                }

                const data = await response.json();

                if (!data.chart || !data.chart.result || data.chart.result.length === 0) {
                    throw new Error('データの取得に失敗しました');
                }

                const result = data.chart.result[0];
                const timestamps = result.timestamp;
                const quotes = result.indicators.quote[0];

                // チャート用データを整形
                const chartData = timestamps.map((timestamp, index) => ({
                    date: new Date(timestamp * 1000).toISOString().split('T')[0],
                    time: timestamp * 1000,
                    open: quotes.open[index],
                    high: quotes.high[index],
                    low: quotes.low[index],
                    close: quotes.close[index],
                    volume: quotes.volume[index]
                })).filter(item => item.close !== null);

                // 最新の株価情報
                const latestData = chartData[chartData.length - 1];
                const previousClose = chartData[chartData.length - 2]?.close || latestData.close;
                const change = latestData.close - previousClose;
                const changePercent = (change / previousClose) * 100;

                // データをキャッシュ
                cachedData = {
                    currentPrice: {
                        symbol: STOCK_SYMBOL,
                        name: '日清オイリオグループ',
                        price: latestData.close,
                        change: change,
                        changePercent: changePercent,
                        high: latestData.high,
                        low: latestData.low,
                        volume: latestData.volume,
                        date: latestData.date
                    },
                    chartData: chartData,
                    lastUpdate: new Date().toISOString()
                };

                lastFetchTime = Date.now();
                console.log('データ取得成功:', cachedData.lastUpdate);
                return cachedData;

            } catch (error) {
                console.error('株価データ取得エラー:', error.message);
                throw error;
            }
        }

        /**
         * ヘッダー部の株価情報を更新
         */
        function updateStockHeader(data) {
            const currentPrice = data.currentPrice;

            // 会社名とシンボル
            document.getElementById('companyName').textContent = currentPrice.name;
            document.getElementById('stockSymbol').textContent = currentPrice.symbol;

            // 現在値
            document.getElementById('currentPrice').textContent = '¥' + formatNumber(currentPrice.price, 2);

            // 変動
            const changeElement = document.getElementById('priceChange');
            const changePercentElement = document.getElementById('changePercent');

            const changeSign = currentPrice.change >= 0 ? '+' : '';
            changeElement.textContent = changeSign + formatNumber(currentPrice.change, 2);
            changePercentElement.textContent = '(' + changeSign + currentPrice.changePercent.toFixed(2) + '%)';

            // 色の設定
            const changeClass = currentPrice.change > 0 ? 'positive' : currentPrice.change < 0 ? 'negative' : 'neutral';
            changeElement.className = 'change ' + changeClass;
            changePercentElement.className = 'change-percent ' + changeClass;

            // 高値・安値・出来高
            document.getElementById('highPrice').textContent = '¥' + formatNumber(currentPrice.high, 2);
            document.getElementById('lowPrice').textContent = '¥' + formatNumber(currentPrice.low, 2);
            document.getElementById('volume').textContent = formatVolume(currentPrice.volume);

            // 最終更新時刻
            document.getElementById('lastUpdate').textContent = '最終更新: ' + formatDateTime(data.lastUpdate);
        }

        /**
         * 市場ステータスを更新
         */
        function updateMarketStatus() {
            const statusElement = document.getElementById('marketStatus');
            if (isMarketHours()) {
                statusElement.textContent = '市場時間内';
                statusElement.className = 'market-status market-open';
            } else {
                statusElement.textContent = '市場時間外';
                statusElement.className = 'market-status market-closed';
            }
        }

        /**
         * ローソク足チャートを作成・更新
         */
        function updateChart(chartData) {
            const ctx = document.getElementById('stockChart').getContext('2d');

            // 既存のチャートを破棄
            if (chart) {
                chart.destroy();
            }

            // ローソク足データの準備
            const candlestickData = chartData.map(item => ({
                x: item.time,
                o: item.open,
                h: item.high,
                l: item.low,
                c: item.close
            }));

            // Chart.jsの設定（ローソク足）
            chart = new Chart(ctx, {
                type: 'candlestick',
                data: {
                    datasets: [{
                        label: '日清オイリオグループ (2602.T)',
                        data: candlestickData,
                        color: {
                            up: '#22c55e',      // 陽線（上昇）: 緑
                            down: '#ef4444',    // 陰線（下落）: 赤
                            unchanged: '#999'   // 変わらず: グレー
                        },
                        borderColor: {
                            up: '#16a34a',      // 陽線の枠線: 濃い緑
                            down: '#dc2626',    // 陰線の枠線: 濃い赤
                            unchanged: '#666'   // 変わらずの枠線: 濃いグレー
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    parsing: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: {
                                    size: window.innerWidth > 768 ? 16 : 12
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const point = context.raw;
                                    const index = context.dataIndex;
                                    const item = chartData[index];
                                    return [
                                        '始値: ¥' + formatNumber(point.o, 2),
                                        '高値: ¥' + formatNumber(point.h, 2),
                                        '安値: ¥' + formatNumber(point.l, 2),
                                        '終値: ¥' + formatNumber(point.c, 2),
                                        '出来高: ' + formatVolume(item.volume)
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'month',
                                displayFormats: {
                                    month: 'yyyy/MM'
                                }
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: window.innerWidth > 768 ? 14 : 10
                                }
                            }
                        },
                        y: {
                            position: 'right',
                            ticks: {
                                callback: function(value) {
                                    return '¥' + formatNumber(value, 0);
                                },
                                font: {
                                    size: window.innerWidth > 768 ? 14 : 10
                                }
                            }
                        }
                    }
                }
            });
        }

        /**
         * データ更新が必要かチェック
         */
        function shouldFetchData() {
            // キャッシュがない場合は取得
            if (!cachedData || !lastFetchTime) {
                return true;
            }

            // 市場時間外はキャッシュを使用
            if (!isMarketHours()) {
                return false;
            }

            // 最後の取得から30分以上経過している場合は再取得
            const timeSinceLastFetch = Date.now() - lastFetchTime;
            return timeSinceLastFetch >= UPDATE_INTERVAL;
        }

        /**
         * 株価データを取得して画面を更新
         */
        async function updateStockDisplay() {
            try {
                // データ取得が必要かチェック
                if (shouldFetchData()) {
                    toggleLoading(true);
                    await fetchStockData();
                    toggleLoading(false);
                }

                // キャッシュデータを使用して表示を更新
                if (cachedData) {
                    updateStockHeader(cachedData);
                    updateMarketStatus();
                    updateChart(cachedData.chartData);
                }

            } catch (error) {
                console.error('データ更新エラー:', error);
                toggleLoading(false);
                showError('株価データの取得に失敗しました。しばらくしてから再度お試しください。');
            }
        }

        /**
         * ページ読み込み時とリサイズ時の処理
         */
        window.addEventListener('load', async () => {
            // 初回データ取得
            await updateStockDisplay();

            // 30秒ごとに表示を更新（必要に応じてAPIから再取得）
            setInterval(updateStockDisplay, POLL_INTERVAL);
        });

        // ウィンドウリサイズ時にチャートを再描画
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (chart) {
                    chart.resize();
                }
            }, 250);
        });
    </script>
</body>
</html>

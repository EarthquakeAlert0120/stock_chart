<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株価チャート</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 95%;
            margin: 0 auto;
            padding: 30px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #1565c0;
            text-align: center;
            margin-bottom: 10px;
            font-size: 52px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .update-time {
            color: #666;
            font-size: 20px;
            text-align: right;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        select, button {
            padding: 12px 24px;
            font-size: 24px;
            margin: 5px;
            border: 2px solid #ccc;
            border-radius: 6px;
        }
        button {
            background: #1565c0;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #0d47a1;
        }
        #chart {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .info {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .price-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .price-box {
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            min-width: 200px;
            text-align: center;
        }
        .price-label {
            font-size: 20px;
            color: #666;
            margin-bottom: 10px;
        }
        .price-value {
            font-size: 36px;
            font-weight: bold;
            color: #1565c0;
        }
        .price-value.positive { color: #ef5350; }
        .price-value.negative { color: #42a5f5; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 24px;
        }
        .error-box {
            background: #ffebee;
            border: 3px solid #f44336;
            padding: 30px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
        }
        .error-text {
            color: #c62828;
            font-size: 22px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>📈 2602 日清オイリオグループ</h1>
        <div class="update-time" id="updateTime">更新日時: 取得中...</div>
    </div>
    <div class="subtitle">東証プライム - 株価チャート</div>
    
    <div class="controls">
        <label><strong>表示期間：</strong></label>
        <select id="period">
            <option value="7">1週間</option>
            <option value="30">1ヶ月</option>
            <option value="90">3ヶ月</option>
            <option value="180">6ヶ月</option>
            <option value="365" selected>1年</option>
            <option value="730">2年</option>
        </select>
        <button onclick="fetchStockData()">🔄 更新</button>
    </div>
    
    <div id="errorBox" style="display: none;"></div>
    
    <div class="info">
        <div class="price-info" id="priceInfo">
            <div class="loading">データ読み込み中...</div>
        </div>
    </div>
    
    <div id="chart" style="width:100%; height:700px;"></div>

    <script>
        let autoUpdateTimer = null;
        
        async function fetchStockData() {
            const symbol = '2602.T';
            const days = parseInt(document.getElementById('period').value);
            const period1 = Math.floor(Date.now() / 1000) - (days * 24 * 60 * 60);
            const period2 = Math.floor(Date.now() / 1000);
            
            const apiUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?period1=${period1}&period2=${period2}&interval=1d`;
            
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
                apiUrl
            ];
            
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';
            
            for (let i = 0; i < proxies.length; i++) {
                const proxyUrl = proxies[i];
                
                try {
                    const response = await fetch(proxyUrl);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.chart?.error) {
                        throw new Error(data.chart.error.description);
                    }
                    
                    if (!data.chart?.result?.[0]) {
                        throw new Error('株価データが見つかりません');
                    }
                    
                    const result = data.chart.result[0];
                    const timestamps = result.timestamp;
                    const quotes = result.indicators.quote[0];
                    
                    if (!timestamps || !quotes) {
                        throw new Error('データ形式が不正です');
                    }
                    
                    const dates = timestamps.map(ts => {
                        const date = new Date(ts * 1000);
                        return date.toISOString().split('T')[0];
                    });
                    
                    displayPriceInfo(quotes, dates);
                    
                    const trace = {
                        x: dates,
                        open: quotes.open,
                        high: quotes.high,
                        low: quotes.low,
                        close: quotes.close,
                        type: 'candlestick',
                        increasing: {
                            line: {color: '#ef5350', width: 1.5}
                        },
                        decreasing: {
                            line: {color: '#42a5f5', width: 1.5}
                        }
                    };
                    
                    const layout = {
                        title: {
                            text: '2602 日清オイリオグループ 株価推移',
                            font: {size: 32}
                        },
                        xaxis: {
                            title: {
                                text: '日付',
                                font: {size: 22}
                            },
                            rangeslider: {visible: false},
                            tickfont: {size: 18}
                        },
                        yaxis: {
                            title: {
                                text: '株価（円）',
                                font: {size: 22}
                            },
                            tickfont: {size: 18}
                        },
                        height: 700,
                        paper_bgcolor: 'white',
                        plot_bgcolor: '#fafafa',
                        margin: {
                            l: 80,
                            r: 50,
                            t: 80,
                            b: 80
                        }
                    };
                    
                    Plotly.newPlot('chart', [trace], layout, {responsive: true});
                    
                    updateTimestamp();
                    resetAutoUpdate();
                    
                    return;
                    
                } catch (error) {
                    if (i === proxies.length - 1) {
                        showError(error.message);
                    }
                }
            }
        }
        
        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.className = 'error-box';
            errorBox.style.display = 'block';
            errorBox.innerHTML = `
                <div class="error-text">❌ データ取得に失敗しました</div>
                <div class="error-text">${message}</div>
                <button onclick="fetchStockData()" style="margin-top: 15px; padding: 12px 24px; background: #1565c0; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 20px;">
                    再試行
                </button>
            `;
            
            document.getElementById('priceInfo').innerHTML = `
                <div class="price-box">
                    <div class="price-label" style="color: #f44336;">データ取得失敗</div>
                    <div class="price-value" style="font-size: 22px; color: #666;">
                        上記のボタンで再試行してください
                    </div>
                </div>
            `;
        }
        
        function displayPriceInfo(quotes, dates) {
            const validIndices = quotes.close
                .map((p, i) => p !== null ? i : -1)
                .filter(i => i !== -1);
            
            if (validIndices.length === 0) {
                document.getElementById('priceInfo').innerHTML = '<p style="font-size: 24px;">有効なデータがありません</p>';
                return;
            }
            
            const latestIndex = validIndices[validIndices.length - 1];
            const previousIndex = validIndices[validIndices.length - 2];
            
            const current = quotes.close[latestIndex];
            const previous = quotes.close[previousIndex];
            const change = current - previous;
            const changePercent = ((change / previous) * 100).toFixed(2);
            
            const changeClass = change >= 0 ? 'positive' : 'negative';
            const changeSymbol = change >= 0 ? '+' : '';
            
            document.getElementById('priceInfo').innerHTML = `
                <div class="price-box">
                    <div class="price-label">現在値（${dates[latestIndex]}）</div>
                    <div class="price-value">${current.toFixed(2)} 円</div>
                </div>
                <div class="price-box">
                    <div class="price-label">前日比</div>
                    <div class="price-value ${changeClass}">
                        ${changeSymbol}${change.toFixed(2)} 円<br>
                        <span style="font-size: 28px;">(${changeSymbol}${changePercent}%)</span>
                    </div>
                </div>
                <div class="price-box">
                    <div class="price-label">始値</div>
                    <div class="price-value">${quotes.open[latestIndex].toFixed(2)} 円</div>
                </div>
                <div class="price-box">
                    <div class="price-label">高値</div>
                    <div class="price-value">${quotes.high[latestIndex].toFixed(2)} 円</div>
                </div>
                <div class="price-box">
                    <div class="price-label">安値</div>
                    <div class="price-value">${quotes.low[latestIndex].toFixed(2)} 円</div>
                </div>
            `;
        }
        
        function updateTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('updateTime').textContent = 
                `更新日時: ${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
        
        function resetAutoUpdate() {
            if (autoUpdateTimer) {
                clearTimeout(autoUpdateTimer);
            }
            
            autoUpdateTimer = setTimeout(() => {
                fetchStockData();
            }, 30 * 60 * 1000);
        }
        
        window.addEventListener('load', fetchStockData);
        document.getElementById('period').addEventListener('change', fetchStockData);
    </script>
</body>
</html>

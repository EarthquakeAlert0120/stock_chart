<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日清オイリオグループ (2602.T) 株価チャート</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 98%;
            margin: 0 auto;
        }

        /* ヘッダー部: 株価情報 */
        .stock-header {
            background: white;
            border-radius: 25px;
            padding: clamp(30px, 3vw, 60px);
            margin-bottom: clamp(20px, 2vw, 40px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .company-info {
            display: flex;
            align-items: center;
            gap: clamp(15px, 2vw, 40px);
            margin-bottom: clamp(20px, 2.5vw, 50px);
            flex-wrap: wrap;
        }

        .company-info h1 {
            font-size: clamp(32px, 5vw, 120px);
            font-weight: 700;
            color: #1a1a1a;
        }

        .symbol {
            font-size: clamp(18px, 2.5vw, 56px);
            color: #666;
            background: #f0f0f0;
            padding: clamp(8px, 1vw, 20px) clamp(20px, 2vw, 40px);
            border-radius: 12px;
            font-weight: 600;
        }

        .price-info {
            display: flex;
            align-items: baseline;
            gap: clamp(20px, 3vw, 60px);
            margin-bottom: clamp(25px, 3vw, 60px);
            flex-wrap: wrap;
        }

        .current-price {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: clamp(16px, 2vw, 42px);
            color: #666;
            margin-bottom: clamp(5px, 1vw, 15px);
            font-weight: 600;
        }

        .price {
            font-size: clamp(48px, 7vw, 140px);
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.1;
        }

        .price-change {
            display: flex;
            flex-direction: column;
            gap: clamp(5px, 1vw, 15px);
        }

        .change,
        .change-percent {
            font-size: clamp(24px, 3.5vw, 80px);
            font-weight: 600;
        }

        .positive {
            color: #22c55e;
        }

        .negative {
            color: #ef4444;
        }

        .neutral {
            color: #666;
        }

        .additional-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(clamp(200px, 20vw, 400px), 1fr));
            gap: clamp(20px, 2.5vw, 50px);
            padding: clamp(20px, 2.5vw, 50px) 0;
            border-top: 3px solid #f0f0f0;
            border-bottom: 3px solid #f0f0f0;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1vw, 20px);
        }

        .info-label {
            font-size: clamp(16px, 2vw, 42px);
            color: #666;
            font-weight: 600;
        }

        .info-value {
            font-size: clamp(24px, 3vw, 68px);
            font-weight: 700;
            color: #1a1a1a;
        }

        .update-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: clamp(20px, 2.5vw, 50px);
            font-size: clamp(16px, 2vw, 38px);
            color: #666;
            flex-wrap: wrap;
            gap: clamp(10px, 1.5vw, 30px);
        }

        .market-status {
            padding: clamp(8px, 1vw, 20px) clamp(20px, 2vw, 40px);
            border-radius: 25px;
            font-weight: 700;
            font-size: clamp(16px, 2vw, 38px);
        }

        .market-open {
            background: #dcfce7;
            color: #16a34a;
        }

        .market-closed {
            background: #fee2e2;
            color: #dc2626;
        }

        /* チャート表示部 */
        .chart-container {
            background: white;
            border-radius: 25px;
            padding: clamp(30px, 3vw, 60px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: clamp(20px, 2vw, 40px);
        }

        .chart-wrapper {
            position: relative;
            height: clamp(500px, 65vh, 1000px);
        }

        /* フッター */
        footer {
            text-align: center;
            color: white;
            font-size: clamp(16px, 2vw, 36px);
            padding: clamp(20px, 2.5vw, 50px);
            font-weight: 500;
        }

        footer p {
            margin: clamp(8px, 1vw, 20px) 0;
        }

        /* ローディング表示 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: clamp(60px, 5vw, 120px);
            height: clamp(60px, 5vw, 120px);
            border: clamp(6px, 0.5vw, 12px) solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* エラーメッセージ */
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: clamp(20px, 2.5vw, 50px);
            border-radius: 15px;
            margin: clamp(20px, 2vw, 40px) 0;
            text-align: center;
            font-weight: 700;
            font-size: clamp(18px, 2vw, 40px);
        }

        /* 超大画面対応 */
        @media (min-width: 2560px) {
            body { 
                padding: 60px; 
            }
            .container { 
                max-width: 95%; 
            }
            .stock-header {
                padding: 80px;
            }
            .chart-container {
                padding: 80px;
            }
            .chart-wrapper {
                height: 75vh;
                min-height: 900px;
            }
        }

        /* 4K/8K対応 */
        @media (min-width: 3840px) {
            body { 
                padding: 80px; 
            }
            .chart-wrapper {
                height: 80vh;
                min-height: 1200px;
            }
        }
    </style>
</head>
<body>
    <!-- ローディング表示 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="container">
        <!-- エラーメッセージ -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- ヘッダー部: 株価情報 -->
        <header class="stock-header">
            <div class="company-info">
                <h1 id="companyName">日清オイリオグループ</h1>
                <span id="stockSymbol" class="symbol">2602.T</span>
            </div>

            <div class="price-info">
                <div class="current-price">
                    <span class="price-label">現在値</span>
                    <span id="currentPrice" class="price">-</span>
                </div>
                <div class="price-change">
                    <span id="priceChange" class="change">-</span>
                    <span id="changePercent" class="change-percent">-</span>
                </div>
            </div>

            <div class="additional-info">
                <div class="info-item">
                    <span class="info-label">高値</span>
                    <span id="highPrice" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">安値</span>
                    <span id="lowPrice" class="info-value">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">出来高</span>
                    <span id="volume" class="info-value">-</span>
                </div>
            </div>

            <div class="update-info">
                <span id="lastUpdate">最終更新: -</span>
                <span id="marketStatus" class="market-status">-</span>
            </div>
        </header>

        <!-- チャート表示部 -->
        <main class="chart-container">
            <div class="chart-wrapper">
                <canvas id="stockChart"></canvas>
            </div>
        </main>

        <!-- フッター -->
        <footer>
            <p>※株価データは60分間隔で自動更新されます</p>
            <p>データ提供: Yahoo Finance</p>
        </footer>
    </div>

    <script>
        let chart = null;
        let cachedData = null;
        let lastFetchTime = null;
        const STOCK_SYMBOL = '2602.T';
        const UPDATE_INTERVAL = 60 * 60 * 1000; // 60分
        const POLL_INTERVAL = 30 * 1000; // 30秒

        function isMarketHours() {
            const now = new Date();
            const hours = now.getHours();
            const day = now.getDay();

            if (day === 0 || day === 6) {
                return false;
            }

            return hours >= 9 && hours < 16;
        }

        function formatNumber(num, decimals = 0) {
            if (num === null || num === undefined || isNaN(num)) return '-';
            return num.toLocaleString('ja-JP', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        function formatVolume(volume) {
            if (volume === null || volume === undefined || isNaN(volume)) return '-';
            if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(2) + 'K';
            }
            return formatNumber(volume);
        }

        function formatDateTime(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
            setTimeout(() => {
                errorElement.classList.add('hidden');
            }, 5000);
        }

        function toggleLoading(show) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (show) {
                loadingOverlay.classList.remove('hidden');
            } else {
                loadingOverlay.classList.add('hidden');
            }
        }

        async function fetchStockData() {
            try {
                console.log('株価データを取得中...');

                const endDate = Math.floor(Date.now() / 1000);
                const startDate = endDate - (365 * 24 * 60 * 60);

                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const apiUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${STOCK_SYMBOL}?period1=${startDate}&period2=${endDate}&interval=1d`;
                const url = proxyUrl + encodeURIComponent(apiUrl);

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('データの取得に失敗しました');
                }

                const data = await response.json();

                if (!data.chart || !data.chart.result || data.chart.result.length === 0) {
                    throw new Error('データの取得に失敗しました');
                }

                const result = data.chart.result[0];
                const timestamps = result.timestamp;
                const quotes = result.indicators.quote[0];

                const chartData = timestamps.map((timestamp, index) => ({
                    date: new Date(timestamp * 1000).toISOString().split('T')[0],
                    time: timestamp * 1000,
                    open: quotes.open[index],
                    high: quotes.high[index],
                    low: quotes.low[index],
                    close: quotes.close[index],
                    volume: quotes.volume[index]
                })).filter(item => item.close !== null);

                const latestData = chartData[chartData.length - 1];
                const previousClose = chartData[chartData.length - 2]?.close || latestData.close;
                const change = latestData.close - previousClose;
                const changePercent = (change / previousClose) * 100;

                cachedData = {
                    currentPrice: {
                        symbol: STOCK_SYMBOL,
                        name: '日清オイリオグループ',
                        price: latestData.close,
                        change: change,
                        changePercent: changePercent,
                        high: latestData.high,
                        low: latestData.low,
                        volume: latestData.volume,
                        date: latestData.date
                    },
                    chartData: chartData,
                    lastUpdate: new Date().toISOString()
                };

                lastFetchTime = Date.now();
                console.log('データ取得成功:', cachedData.lastUpdate);
                return cachedData;

            } catch (error) {
                console.error('株価データ取得エラー:', error.message);
                throw error;
            }
        }

        function updateStockHeader(data) {
            const currentPrice = data.currentPrice;

            document.getElementById('companyName').textContent = currentPrice.name;
            document.getElementById('stockSymbol').textContent = currentPrice.symbol;
            document.getElementById('currentPrice').textContent = '¥' + formatNumber(currentPrice.price, 2);

            const changeElement = document.getElementById('priceChange');
            const changePercentElement = document.getElementById('changePercent');

            const changeSign = currentPrice.change >= 0 ? '+' : '';
            changeElement.textContent = changeSign + formatNumber(currentPrice.change, 2);
            changePercentElement.textContent = '(' + changeSign + currentPrice.changePercent.toFixed(2) + '%)';

            const changeClass = currentPrice.change > 0 ? 'positive' : currentPrice.change < 0 ? 'negative' : 'neutral';
            changeElement.className = 'change ' + changeClass;
            changePercentElement.className = 'change-percent ' + changeClass;

            document.getElementById('highPrice').textContent = '¥' + formatNumber(currentPrice.high, 2);
            document.getElementById('lowPrice').textContent = '¥' + formatNumber(currentPrice.low, 2);
            document.getElementById('volume').textContent = formatVolume(currentPrice.volume);
            document.getElementById('lastUpdate').textContent = '最終更新: ' + formatDateTime(data.lastUpdate);
        }

        function updateMarketStatus() {
            const statusElement = document.getElementById('marketStatus');
            if (isMarketHours()) {
                statusElement.textContent = '市場時間内';
                statusElement.className = 'market-status market-open';
            } else {
                statusElement.textContent = '市場時間外';
                statusElement.className = 'market-status market-closed';
            }
        }

        function updateChart(chartData) {
            const ctx = document.getElementById('stockChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            const candlestickData = chartData.map(item => ({
                x: item.time,
                o: item.open,
                h: item.high,
                l: item.low,
                c: item.close
            }));

            // 画面サイズに応じたフォントサイズ
            const screenWidth = window.innerWidth;
            const baseFontSize = screenWidth > 3840 ? 32 : screenWidth > 2560 ? 24 : screenWidth > 1920 ? 18 : 14;
            const titleFontSize = screenWidth > 3840 ? 48 : screenWidth > 2560 ? 36 : screenWidth > 1920 ? 28 : 20;
            const lineWidth = screenWidth > 2560 ? 3 : 2;

            chart = new Chart(ctx, {
                type: 'candlestick',
                data: {
                    datasets: [{
                        label: '日清オイリオグループ (2602.T)',
                        data: candlestickData,
                        color: {
                            up: '#22c55e',
                            down: '#ef4444',
                            unchanged: '#999'
                        },
                        borderColor: {
                            up: '#16a34a',
                            down: '#dc2626',
                            unchanged: '#666'
                        },
                        borderWidth: lineWidth
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    parsing: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: {
                                    size: titleFontSize,
                                    weight: 'bold'
                                },
                                padding: 20
                            }
                        },
                        tooltip: {
                            titleFont: {
                                size: baseFontSize + 2
                            },
                            bodyFont: {
                                size: baseFontSize
                            },
                            padding: 15,
                            callbacks: {
                                label: function(context) {
                                    const point = context.raw;
                                    const index = context.dataIndex;
                                    const item = chartData[index];
                                    return [
                                        '始値: ¥' + formatNumber(point.o, 2),
                                        '高値: ¥' + formatNumber(point.h, 2),
                                        '安値: ¥' + formatNumber(point.l, 2),
                                        '終値: ¥' + formatNumber(point.c, 2),
                                        '出来高: ' + formatVolume(item.volume)
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'month',
                                displayFormats: {
                                    month: 'yyyy/MM'
                                }
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: baseFontSize,
                                    weight: '500'
                                }
                            }
                        },
                        y: {
                            position: 'right',
                            ticks: {
                                callback: function(value) {
                                    return '¥' + formatNumber(value, 0);
                                },
                                font: {
                                    size: baseFontSize,
                                    weight: '500'
                                }
                            },
                            grid: {
                                color: '#e0e0e0'
                            }
                        }
                    }
                }
            });
        }

        function shouldFetchData() {
            if (!cachedData || !lastFetchTime) {
                return true;
            }

            if (!isMarketHours()) {
                return false;
            }

            const timeSinceLastFetch = Date.now() - lastFetchTime;
            return timeSinceLastFetch >= UPDATE_INTERVAL;
        }

        async function updateStockDisplay() {
            try {
                if (shouldFetchData()) {
                    toggleLoading(true);
                    await fetchStockData();
                    toggleLoading(false);
                }

                if (cachedData) {
                    updateStockHeader(cachedData);
                    updateMarketStatus();
                    updateChart(cachedData.chartData);
                }

            } catch (error) {
                console.error('データ更新エラー:', error);
                toggleLoading(false);
                showError('株価データの取得に失敗しました。しばらくしてから再度お試しください。');
            }
        }

        window.addEventListener('load', async () => {
            await updateStockDisplay();
            setInterval(updateStockDisplay, POLL_INTERVAL);
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (chart && cachedData) {
                    updateChart(cachedData.chartData);
                }
            }, 250);
        });
    </script>
</body>
</html>

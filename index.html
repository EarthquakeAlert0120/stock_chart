<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株価チャート</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 98%;
            margin: 0 auto;
        }
        h1 {
            color: #1565c0;
            text-align: center;
            margin-bottom: 15px;
            font-size: clamp(48px, 5vw, 96px);
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: clamp(20px, 2vw, 40px);
            margin-bottom: 30px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .update-time {
            color: #666;
            font-size: clamp(18px, 1.5vw, 32px);
            text-align: right;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        select, button {
            padding: 18px 36px;
            font-size: clamp(20px, 2vw, 36px);
            margin: 10px;
            border: 3px solid #ccc;
            border-radius: 10px;
        }
        button {
            background: #1565c0;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background: #0d47a1;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #chart {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        .info {
            background: white;
            padding: 40px;
            margin: 30px 0;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .price-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .price-box {
            padding: 30px;
            background: #f5f5f5;
            border-radius: 12px;
            text-align: center;
        }
        .price-label {
            font-size: clamp(18px, 1.8vw, 32px);
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .price-value {
            font-size: clamp(32px, 3.5vw, 64px);
            font-weight: bold;
            color: #1565c0;
        }
        .price-value.positive { color: #ef5350; }
        .price-value.negative { color: #42a5f5; }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: clamp(20px, 2vw, 36px);
        }
        .error-box {
            background: #ffebee;
            border: 4px solid #f44336;
            padding: 40px;
            margin: 30px 0;
            border-radius: 15px;
            text-align: center;
        }
        .error-text {
            color: #c62828;
            font-size: clamp(18px, 2vw, 32px);
            margin: 15px 0;
        }
        .cache-status {
            background: #e3f2fd;
            border: 3px solid #1565c0;
            padding: 25px 40px;
            margin: 25px 0;
            border-radius: 12px;
            text-align: center;
            font-size: clamp(18px, 2vw, 32px);
            color: #1565c0;
            font-weight: 600;
        }
        .next-update {
            font-weight: bold;
            color: #0d47a1;
            font-size: clamp(20px, 2.2vw, 36px);
        }
        .status-indicator {
            display: inline-block;
            width: clamp(12px, 1vw, 20px);
            height: clamp(12px, 1vw, 20px);
            border-radius: 50%;
            margin-right: 12px;
            background: #4caf50;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 大画面専用スタイル */
        @media (min-width: 2560px) {
            body { padding: 60px; }
            .container { max-width: 95%; }
            h1 { font-size: 120px !important; }
            .subtitle { font-size: 52px !important; }
            .price-value { font-size: 80px !important; }
            .price-label { font-size: 40px !important; }
            .update-time { font-size: 36px !important; }
            select, button { 
                font-size: 44px !important; 
                padding: 24px 48px !important; 
            }
            .cache-status { font-size: 40px !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1>📈 2602 日清オイリオグループ</h1>
            <div class="update-time" id="updateTime">データ取得日時: 取得中...</div>
        </div>
        <div class="subtitle">東証プライム - 株価チャート</div>
        
        <div class="cache-status" id="cacheStatus">
            <span class="status-indicator"></span>
            初回データ取得中...
        </div>
        
        <div class="controls">
            <label><strong>表示期間：</strong></label>
            <select id="period">
                <option value="7">1週間</option>
                <option value="30">1ヶ月</option>
                <option value="90">3ヶ月</option>
                <option value="180">6ヶ月</option>
                <option value="365" selected>1年</option>
                <option value="730">2年</option>
            </select>
            <button id="updateBtn" onclick="manualUpdate()">🔄 手動更新</button>
        </div>
        
        <div id="errorBox" style="display: none;"></div>
        
        <div class="info">
            <div class="price-info" id="priceInfo">
                <div class="loading">データ読み込み中...</div>
            </div>
        </div>
        
        <div id="chart" style="width:100%; height:clamp(600px, 70vh, 1200px);"></div>
    </div>

    <script>
        let globalCache = null;
        let cacheTimestamp = null;
        let autoUpdateTimer = null;
        let countdownTimer = null;
        const CACHE_DURATION = 60 * 60 * 1000; // 60分
        let isUpdating = false;
        
        async function initialize() {
            await fetchAndCacheData();
            scheduleNextUpdate();
            startCountdown();
        }
        
        async function fetchAndCacheData(showLoading = true) {
            if (isUpdating) return;
            isUpdating = true;
            
            const updateBtn = document.getElementById('updateBtn');
            const errorBox = document.getElementById('errorBox');
            
            if (showLoading) {
                updateBtn.disabled = true;
                updateBtn.textContent = '更新中...';
            }
            
            errorBox.style.display = 'none';
            
            const symbol = '2602.T';
            const days = parseInt(document.getElementById('period').value);
            const period1 = Math.floor(Date.now() / 1000) - (days * 24 * 60 * 60);
            const period2 = Math.floor(Date.now() / 1000);
            
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?period1=${period1}&period2=${period2}&interval=1d`)}`,
                `https://corsproxy.io/?${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?period1=${period1}&period2=${period2}&interval=1d`)}`
            ];
            
            for (let i = 0; i < proxies.length; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000);
                    
                    const response = await fetch(proxies[i], {
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    let data = await response.json();
                    
                    if (data.contents) {
                        data = JSON.parse(data.contents);
                    }
                    
                    if (data.chart?.error) {
                        throw new Error(data.chart.error.description);
                    }
                    
                    if (!data.chart?.result?.[0]) {
                        throw new Error('株価データが見つかりません');
                    }
                    
                    const result = data.chart.result[0];
                    const timestamps = result.timestamp;
                    const quotes = result.indicators.quote[0];
                    
                    if (!timestamps || !quotes) {
                        throw new Error('データ形式が不正です');
                    }
                    
                    globalCache = {
                        timestamps: timestamps,
                        quotes: quotes,
                        period: days
                    };
                    cacheTimestamp = Date.now();
                    
                    displayFromCache();
                    
                    if (showLoading) {
                        updateBtn.disabled = false;
                        updateBtn.textContent = '🔄 手動更新';
                    }
                    
                    updateCacheStatus();
                    isUpdating = false;
                    
                    console.log(`✅ データ更新成功 (${new Date().toLocaleTimeString()})`);
                    
                    return true;
                    
                } catch (error) {
                    console.error(`Proxy ${i + 1} failed:`, error);
                    
                    if (i === proxies.length - 1) {
                        showError(error.message);
                        isUpdating = false;
                        
                        if (showLoading) {
                            updateBtn.disabled = false;
                            updateBtn.textContent = '🔄 手動更新';
                        }
                        
                        return false;
                    }
                }
            }
        }
        
        function displayFromCache() {
            if (!globalCache) return;
            
            const { timestamps, quotes } = globalCache;
            
            const dates = timestamps.map(ts => {
                const date = new Date(ts * 1000);
                return date.toISOString().split('T')[0];
            });
            
            displayPriceInfo(quotes, dates);
            
            const trace = {
                x: dates,
                open: quotes.open,
                high: quotes.high,
                low: quotes.low,
                close: quotes.close,
                type: 'candlestick',
                increasing: {
                    line: {color: '#ef5350', width: 3}
                },
                decreasing: {
                    line: {color: '#42a5f5', width: 3}
                }
            };
            
            const layout = {
                title: {
                    text: '2602 日清オイリオグループ 株価推移',
                    font: {size: window.innerWidth > 2560 ? 56 : 40}
                },
                xaxis: {
                    title: {
                        text: '日付',
                        font: {size: window.innerWidth > 2560 ? 36 : 28}
                    },
                    rangeslider: {visible: false},
                    tickfont: {size: window.innerWidth > 2560 ? 28 : 22}
                },
                yaxis: {
                    title: {
                        text: '株価（円）',
                        font: {size: window.innerWidth > 2560 ? 36 : 28}
                    },
                    tickfont: {size: window.innerWidth > 2560 ? 28 : 22}
                },
                height: window.innerHeight * 0.7,
                paper_bgcolor: 'white',
                plot_bgcolor: '#fafafa',
                margin: {
                    l: 120,
                    r: 80,
                    t: 120,
                    b: 100
                }
            };
            
            Plotly.newPlot('chart', [trace], layout, {responsive: true});
            updateDataTimestamp();
        }
        
        function scheduleNextUpdate() {
            if (autoUpdateTimer) {
                clearTimeout(autoUpdateTimer);
            }
            
            autoUpdateTimer = setTimeout(async () => {
                console.log(`🔄 バックグラウンド更新 (${new Date().toLocaleTimeString()})`);
                await fetchAndCacheData(false);
                scheduleNextUpdate();
                startCountdown();
            }, CACHE_DURATION);
        }
        
        function startCountdown() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
            }
            
            countdownTimer = setInterval(() => {
                updateCacheStatus();
            }, 1000);
        }
        
        function updateCacheStatus() {
            if (!cacheTimestamp) {
                document.getElementById('cacheStatus').innerHTML = `
                    <span class="status-indicator"></span>
                    データ取得中...
                `;
                return;
            }
            
            const elapsed = Date.now() - cacheTimestamp;
            const remaining = CACHE_DURATION - elapsed;
            
            if (remaining > 0) {
                const minutes = Math.floor(remaining / 1000 / 60);
                const seconds = Math.floor((remaining / 1000) % 60);
                
                document.getElementById('cacheStatus').innerHTML = `
                    <span class="status-indicator"></span>
                    キャッシュ有効 | 次回自動更新まで <span class="next-update">${minutes}分${String(seconds).padStart(2, '0')}秒</span>
                `;
            } else {
                document.getElementById('cacheStatus').innerHTML = `
                    <span class="status-indicator"></span>
                    バックグラウンド更新中...
                `;
            }
        }
        
        async function manualUpdate() {
            await fetchAndCacheData(true);
            scheduleNextUpdate();
            startCountdown();
        }
        
        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.className = 'error-box';
            errorBox.style.display = 'block';
            errorBox.innerHTML = `
                <div class="error-text">❌ データ取得に失敗しました</div>
                <div class="error-text" style="font-size: clamp(16px, 1.8vw, 28px);">${message}</div>
                <div class="error-text" style="font-size: clamp(16px, 1.8vw, 28px); margin-top: 15px;">
                    ${globalCache ? 'キャッシュされたデータを表示しています。' : ''}
                </div>
                <button onclick="manualUpdate()" style="margin-top: 20px; padding: 18px 36px; background: #1565c0; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: clamp(18px, 2vw, 32px);">
                    再試行
                </button>
            `;
        }
        
        function displayPriceInfo(quotes, dates) {
            const validIndices = quotes.close
                .map((p, i) => p !== null ? i : -1)
                .filter(i => i !== -1);
            
            if (validIndices.length === 0) {
                document.getElementById('priceInfo').innerHTML = '<p style="font-size: clamp(20px, 2vw, 36px);">有効なデータがありません</p>';
                return;
            }
            
            const latestIndex = validIndices[validIndices.length - 1];
            const previousIndex = validIndices[validIndices.length - 2];
            
            const current = quotes.close[latestIndex];
            const previous = quotes.close[previousIndex];
            const change = current - previous;
            const changePercent = ((change / previous) * 100).toFixed(2);
            
            const changeClass = change >= 0 ? 'positive' : 'negative';
            const changeSymbol = change >= 0 ? '+' : '';
            
            document.getElementById('priceInfo').innerHTML = `
                <div class="price-box">
                    <div class="price-label">現在値（${dates[latestIndex]}）</div>
                    <div class="price-value">${current.toFixed(2)} 円</div>
                </div>
                <div class="price-box">
                    <div class="price-label">前日比</div>
                    <div class="price-value ${changeClass}">
                        ${changeSymbol}${change.toFixed(2)} 円<br>
                        <span style="font-size: clamp(24px, 2.5vw, 48px);">(${changeSymbol}${changePercent}%)</span>
                    </div>
                </div>
                <div class="price-box">
                    <div class="price-label">始値</div>
                    <div class="price-value">${quotes.open[latestIndex].toFixed(2)} 円</div>
                </div>
                <div class="price-box">
                    <div class="price-label">高値</div>
                    <div class="price-value">${quotes.high[latestIndex].toFixed(2)} 円</div>
                </div>
                <div class="price-box">
                    <div class="price-label">安値</div>
                    <div class="price-value">${quotes.low[latestIndex].toFixed(2)} 円</div>
                </div>
            `;
        }
        
        function updateDataTimestamp() {
            if (!cacheTimestamp) return;
            
            const date = new Date(cacheTimestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            
            document.getElementById('updateTime').textContent = 
                `データ取得日時: ${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
        
        document.getElementById('period').addEventListener('change', async () => {
            globalCache = null;
            await fetchAndCacheData(true);
            scheduleNextUpdate();
            startCountdown();
        });
        
        window.addEventListener('load', initialize);
    </script>
</body>
</html>
